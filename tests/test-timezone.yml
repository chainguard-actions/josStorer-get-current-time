name: Test timezone input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          format: HH:mm:ss
          timezone: America/New_York

      - name: Assert formattedTime matches HH:mm:ss pattern
        env:
          ACTUAL: ${{ steps.action.outputs.formattedTime }}
        run: |
          echo "actual formattedTime: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{2}:[0-9]{2}:[0-9]{2}$'; then
            echo "FAIL: formattedTime does not match HH:mm:ss: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert time output is ISO 8601 (unaffected by timezone)
        env:
          ACTUAL: ${{ steps.action.outputs.time }}
        run: |
          echo "actual time: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}'; then
            echo "FAIL: time does not look like ISO 8601: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert readableTime contains timezone offset info
        env:
          ACTUAL: ${{ steps.action.outputs.readableTime }}
        run: |
          echo "actual readableTime: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: readableTime is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert year is a 4-digit number
        env:
          ACTUAL: ${{ steps.action.outputs.year }}
        run: |
          echo "actual year: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{4}$'; then
            echo "FAIL: year does not look like a 4-digit number: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert hour is in valid range for New York timezone
        env:
          ACTUAL: ${{ steps.action.outputs.hour }}
        run: |
          echo "actual hour: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: hour is not numeric: $ACTUAL"
            exit 1
          fi
          if [ "$ACTUAL" -lt 0 ] || [ "$ACTUAL" -gt 23 ]; then
            echo "FAIL: hour out of range: $ACTUAL"
            exit 1
          fi
          echo "PASS"
