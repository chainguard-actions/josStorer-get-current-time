name: Test with format input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get_time
        uses: .
        with:
          format: "YYYY-MM-DD"
      - name: Assert formattedTime matches YYYY-MM-DD pattern
        env:
          FORMATTED: ${{ steps.get_time.outputs.formattedTime }}
        run: |
          echo "formattedTime: $FORMATTED"
          if ! echo "$FORMATTED" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "FAIL: formattedTime '$FORMATTED' does not match YYYY-MM-DD pattern"
            exit 1
          fi
          echo "PASS: formattedTime matches YYYY-MM-DD pattern"
      - name: Assert time (ISO) output is still populated
        env:
          TIME_OUT: ${{ steps.get_time.outputs.time }}
        run: |
          echo "time: $TIME_OUT"
          if [ -z "$TIME_OUT" ]; then
            echo "FAIL: time output is empty"
            exit 1
          fi
          if ! echo "$TIME_OUT" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]+Z$'; then
            echo "FAIL: time does not match ISO 8601 format"
            exit 1
          fi
          echo "PASS: time output is valid ISO 8601"
      - name: Assert year in formattedTime matches year output
        env:
          FORMATTED: ${{ steps.get_time.outputs.formattedTime }}
          YEAR: ${{ steps.get_time.outputs.year }}
        run: |
          echo "formattedTime: $FORMATTED"
          echo "year: $YEAR"
          FORMATTED_YEAR="${FORMATTED:0:4}"
          if [ "$FORMATTED_YEAR" != "$YEAR" ]; then
            echo "FAIL: year in formattedTime ($FORMATTED_YEAR) does not match year output ($YEAR)"
            exit 1
          fi
          echo "PASS: year in formattedTime matches year output"
