name: Test with format input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get_time
        uses: .
        with:
          format: "YYYY-MM-DD"

      - name: Assert formattedTime matches YYYY-MM-DD pattern
        env:
          FORMATTED: ${{ steps.get_time.outputs.formattedTime }}
        run: |
          echo "formattedTime: $FORMATTED"
          if [ -z "$FORMATTED" ]; then
            echo "FAIL: formattedTime output is empty"
            exit 1
          fi
          if ! echo "$FORMATTED" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "FAIL: formattedTime '$FORMATTED' does not match YYYY-MM-DD format"
            exit 1
          fi
          echo "PASS: formattedTime matches YYYY-MM-DD format"

      - name: Assert formattedTime date matches current UTC date
        env:
          FORMATTED: ${{ steps.get_time.outputs.formattedTime }}
        run: |
          CURRENT_DATE=$(date -u +%Y-%m-%d)
          echo "formattedTime: $FORMATTED, current UTC date: $CURRENT_DATE"
          if [ "$FORMATTED" != "$CURRENT_DATE" ]; then
            echo "FAIL: formattedTime '$FORMATTED' does not match current UTC date '$CURRENT_DATE'"
            exit 1
          fi
          echo "PASS: formattedTime matches current UTC date"

      - name: Assert time output is still ISO format (unaffected by format input)
        env:
          TIME_OUT: ${{ steps.get_time.outputs.time }}
        run: |
          echo "time: $TIME_OUT"
          if ! echo "$TIME_OUT" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]+Z$'; then
            echo "FAIL: time output '$TIME_OUT' is not ISO format even with format input set"
            exit 1
          fi
          echo "PASS: time output remains ISO format regardless of format input"
