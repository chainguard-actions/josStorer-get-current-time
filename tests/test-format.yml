name: Test custom format input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          format: YYYY-MM-DD

      - name: Assert formattedTime matches YYYY-MM-DD pattern
        env:
          FORMATTED: ${{ steps.action.outputs.formattedTime }}
        run: |
          echo "formattedTime: $FORMATTED"
          if ! echo "$FORMATTED" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "FAIL: formattedTime '$FORMATTED' does not match YYYY-MM-DD pattern"
            exit 1
          fi
          echo "PASS: formattedTime matches YYYY-MM-DD"

      - name: Assert time (ISO) output is still present
        env:
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "time: $TIME"
          if [ -z "$TIME" ]; then
            echo "FAIL: time output is empty"
            exit 1
          fi
          echo "PASS: time output is non-empty"

      - name: Test HH:mm:ss format
        id: action2
        uses: .
        with:
          format: HH:mm:ss

      - name: Assert formattedTime matches HH:mm:ss pattern
        env:
          FORMATTED: ${{ steps.action2.outputs.formattedTime }}
        run: |
          echo "formattedTime: $FORMATTED"
          if ! echo "$FORMATTED" | grep -qE '^[0-9]{2}:[0-9]{2}:[0-9]{2}$'; then
            echo "FAIL: formattedTime '$FORMATTED' does not match HH:mm:ss pattern"
            exit 1
          fi
          echo "PASS: formattedTime matches HH:mm:ss"
