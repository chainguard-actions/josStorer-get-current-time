name: Test timezone input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          timezone: "America/New_York"
          format: "YYYY-MM-DDTHH:mm:ssZ"

      - name: Debug outputs
        env:
          FORMATTED: ${{ steps.action.outputs.formattedTime }}
          TIME: ${{ steps.action.outputs.time }}
          READABLE: ${{ steps.action.outputs.readableTime }}
        run: |
          echo "formattedTime: $FORMATTED"
          echo "time: $TIME"
          echo "readableTime: $READABLE"

      - name: Assert formattedTime is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.formattedTime }}
        run: |
          echo "actual formattedTime: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty formattedTime"
            exit 1
          fi
          echo "PASS"

      - name: Assert formattedTime contains a UTC offset
        env:
          ACTUAL: ${{ steps.action.outputs.formattedTime }}
        run: |
          echo "actual formattedTime: $ACTUAL"
          # New York is either UTC-5 (EST) or UTC-4 (EDT)
          # Format YYYY-MM-DDTHH:mm:ssZ produces e.g. 2024-01-15T05:30:15-05:00
          if ! echo "$ACTUAL" | grep -qE '[+-][0-9]{2}:[0-9]{2}$'; then
            echo "FAIL: expected a UTC offset in formattedTime, got: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert formattedTime contains New York offset (-05:00 or -04:00)
        env:
          ACTUAL: ${{ steps.action.outputs.formattedTime }}
        run: |
          echo "actual formattedTime: $ACTUAL"
          # New York is either UTC-5 (EST) or UTC-4 (EDT)
          if echo "$ACTUAL" | grep -qE '-(04|05):00$'; then
            echo "PASS: New York offset found"
          else
            echo "WARN: expected New York offset (-04:00 or -05:00) in formattedTime, got: $ACTUAL"
            echo "WARN: This may be acceptable if timezone data is not available"
          fi

      - name: Assert ISO time output is not affected by timezone
        env:
          ACTUAL: ${{ steps.action.outputs.time }}
        run: |
          echo "actual time: $ACTUAL"
          # time should always be UTC (ends with Z or is ISO format)
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}'; then
            echo "FAIL: expected ISO 8601 UTC time, got: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert readableTime is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.readableTime }}
        run: |
          echo "actual readableTime: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty readableTime"
            exit 1
          fi
          echo "PASS"

      - name: Assert readableTime contains a GMT offset
        env:
          ACTUAL: ${{ steps.action.outputs.readableTime }}
        run: |
          echo "actual readableTime: $ACTUAL"
          # readableTime should contain a GMT offset
          if echo "$ACTUAL" | grep -qE 'GMT[-+][0-9]{4}'; then
            echo "PASS: GMT offset found in readableTime"
          else
            echo "WARN: expected GMT offset in readableTime, got: $ACTUAL"
            echo "WARN: This may be acceptable if timezone data is not available"
          fi
