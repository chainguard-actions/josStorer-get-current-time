name: Test format and utcOffset inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          format: YYYY-MM-DD
          utcOffset: "+00:00"

      - name: Assert formattedTime matches YYYY-MM-DD pattern
        env:
          ACTUAL: ${{ steps.action.outputs.formattedTime }}
        run: |
          echo "actual formattedTime: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "FAIL: formattedTime does not match YYYY-MM-DD: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert time output is still ISO 8601 (unaffected by format)
        env:
          ACTUAL: ${{ steps.action.outputs.time }}
        run: |
          echo "actual time: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}'; then
            echo "FAIL: time does not look like ISO 8601: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert readableTime is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.readableTime }}
        run: |
          echo "actual readableTime: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: readableTime is empty"
            exit 1
          fi
          echo "PASS"
