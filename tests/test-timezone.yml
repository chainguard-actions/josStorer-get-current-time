name: Test timezone input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          format: "z"
          timezone: "America/New_York"
      - name: Assert outputs with timezone
        env:
          FORMATTED: ${{ steps.action.outputs.formattedTime }}
          ISO_TIME: ${{ steps.action.outputs.time }}
          READABLE: ${{ steps.action.outputs.readableTime }}
          YEAR: ${{ steps.action.outputs.year }}
          MONTH: ${{ steps.action.outputs.month }}
          DAY: ${{ steps.action.outputs.day }}
          HOUR: ${{ steps.action.outputs.hour }}
          MINUTE: ${{ steps.action.outputs.minute }}
          SECOND: ${{ steps.action.outputs.second }}
          MILLISECOND: ${{ steps.action.outputs.millisecond }}
        run: |
          echo "formattedTime: $FORMATTED"
          echo "time: $ISO_TIME"
          echo "readableTime: $READABLE"
          echo "year: $YEAR"
          echo "month: $MONTH"
          echo "day: $DAY"
          echo "hour: $HOUR"
          echo "minute: $MINUTE"
          echo "second: $SECOND"
          echo "millisecond: $MILLISECOND"
          if [ -z "$ISO_TIME" ]; then
            echo "FAIL: time output is empty"
            exit 1
          fi
          if [ -z "$READABLE" ]; then
            echo "FAIL: readableTime output is empty"
            exit 1
          fi
          if [ -z "$YEAR" ]; then
            echo "FAIL: year output is empty"
            exit 1
          fi
          if [ -z "$MONTH" ]; then
            echo "FAIL: month output is empty"
            exit 1
          fi
          if [ -z "$DAY" ]; then
            echo "FAIL: day output is empty"
            exit 1
          fi
          if [ -z "$HOUR" ]; then
            echo "FAIL: hour output is empty"
            exit 1
          fi
          if [ -z "$MINUTE" ]; then
            echo "FAIL: minute output is empty"
            exit 1
          fi
          if [ -z "$SECOND" ]; then
            echo "FAIL: second output is empty"
            exit 1
          fi
          if [ -z "$MILLISECOND" ]; then
            echo "FAIL: millisecond output is empty"
            exit 1
          fi
          echo "PASS"
