name: Test format input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          format: "YYYY-MM-DD"
      - name: Assert formattedTime output is set
        env:
          FORMATTED: ${{ steps.action.outputs.formattedTime }}
          ISO_TIME: ${{ steps.action.outputs.time }}
          READABLE: ${{ steps.action.outputs.readableTime }}
        run: |
          echo "formattedTime: $FORMATTED"
          echo "time: $ISO_TIME"
          echo "readableTime: $READABLE"
          if [ -z "$FORMATTED" ]; then
            echo "FAIL: formattedTime output is empty"
            exit 1
          fi
          # Verify format matches YYYY-MM-DD pattern
          if ! echo "$FORMATTED" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "FAIL: formattedTime '$FORMATTED' does not match YYYY-MM-DD pattern"
            exit 1
          fi
          if [ -z "$ISO_TIME" ]; then
            echo "FAIL: time output is empty"
            exit 1
          fi
          if [ -z "$READABLE" ]; then
            echo "FAIL: readableTime output is empty"
            exit 1
          fi
          echo "PASS"
