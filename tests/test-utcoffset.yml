name: Test with utcOffset input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get_time
        uses: .
        with:
          utcOffset: "+08:00"
          format: "HH:mm Z"
      - name: Assert formattedTime contains +08:00 offset
        env:
          FORMATTED: ${{ steps.get_time.outputs.formattedTime }}
        run: |
          echo "formattedTime: $FORMATTED"
          if [ -z "$FORMATTED" ]; then
            echo "FAIL: formattedTime is empty"
            exit 1
          fi
          if ! echo "$FORMATTED" | grep -q "+08:00"; then
            echo "FAIL: formattedTime '$FORMATTED' does not contain +08:00 offset"
            exit 1
          fi
          echo "PASS: formattedTime contains +08:00 offset"
      - name: Assert readableTime is non-empty
        env:
          READABLE: ${{ steps.get_time.outputs.readableTime }}
        run: |
          echo "readableTime: $READABLE"
          if [ -z "$READABLE" ]; then
            echo "FAIL: readableTime is empty"
            exit 1
          fi
          echo "PASS: readableTime is non-empty"
      - name: Assert time (ISO) is not affected by utcOffset
        env:
          TIME_OUT: ${{ steps.get_time.outputs.time }}
        run: |
          echo "time: $TIME_OUT"
          if [ -z "$TIME_OUT" ]; then
            echo "FAIL: time output is empty"
            exit 1
          fi
          # ISO time should always end with Z (UTC)
          if ! echo "$TIME_OUT" | grep -qE 'Z$'; then
            echo "FAIL: time output '$TIME_OUT' does not end with Z (should be UTC regardless of utcOffset)"
            exit 1
          fi
          echo "PASS: time output ends with Z (UTC), not affected by utcOffset"
