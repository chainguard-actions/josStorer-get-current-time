name: Test basic usage (no inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .

      - name: Debug all outputs
        env:
          TIME: ${{ steps.action.outputs.time }}
          ISO: ${{ steps.action.outputs.ISOTime }}
          READABLE: ${{ steps.action.outputs.readableTime }}
          FORMATTED: ${{ steps.action.outputs.formattedTime }}
          YEAR: ${{ steps.action.outputs.year }}
          MONTH: ${{ steps.action.outputs.month }}
          DAY: ${{ steps.action.outputs.day }}
          HOUR: ${{ steps.action.outputs.hour }}
          MINUTE: ${{ steps.action.outputs.minute }}
          SECOND: ${{ steps.action.outputs.second }}
          MILLISECOND: ${{ steps.action.outputs.millisecond }}
        run: |
          echo "time: $TIME"
          echo "ISOTime: $ISO"
          echo "readableTime: $READABLE"
          echo "formattedTime: $FORMATTED"
          echo "year: $YEAR"
          echo "month: $MONTH"
          echo "day: $DAY"
          echo "hour: $HOUR"
          echo "minute: $MINUTE"
          echo "second: $SECOND"
          echo "millisecond: $MILLISECOND"

      - name: Assert time output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.time }}
        run: |
          echo "actual time: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty time output"
            exit 1
          fi
          echo "PASS"

      - name: Assert ISOTime matches time
        env:
          TIME: ${{ steps.action.outputs.time }}
          ISO: ${{ steps.action.outputs.ISOTime }}
        run: |
          echo "time: $TIME"
          echo "ISOTime: $ISO"
          if [ "$TIME" != "$ISO" ]; then
            echo "FAIL: expected ISOTime to equal time"
            exit 1
          fi
          echo "PASS"

      - name: Assert readableTime is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.readableTime }}
        run: |
          echo "actual readableTime: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty readableTime output"
            exit 1
          fi
          echo "PASS"

      - name: Assert time output is ISO 8601 UTC format
        env:
          ACTUAL: ${{ steps.action.outputs.time }}
        run: |
          echo "actual time: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}'; then
            echo "FAIL: expected ISO 8601 format (e.g. 2020-01-01T00:30:15.000Z), got: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert year output is a 4-digit number
        env:
          ACTUAL: ${{ steps.action.outputs.year }}
        run: |
          echo "actual year: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "WARN: year output is empty (may not be exposed by act)"
          elif ! echo "$ACTUAL" | grep -qE '^[0-9]{4}$'; then
            echo "FAIL: expected year to be a 4-digit number, got: $ACTUAL"
            exit 1
          else
            echo "PASS"
          fi

      - name: Assert month output is a valid number (1-12)
        env:
          ACTUAL: ${{ steps.action.outputs.month }}
        run: |
          echo "actual month: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "WARN: month output is empty (may not be exposed by act)"
          elif ! echo "$ACTUAL" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: expected month to be a number, got: $ACTUAL"
            exit 1
          else
            echo "PASS"
          fi

      - name: Assert day output is a valid number (1-31)
        env:
          ACTUAL: ${{ steps.action.outputs.day }}
        run: |
          echo "actual day: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "WARN: day output is empty (may not be exposed by act)"
          elif ! echo "$ACTUAL" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: expected day to be a number, got: $ACTUAL"
            exit 1
          else
            echo "PASS"
          fi

      - name: Assert hour output is a valid number (0-23)
        env:
          ACTUAL: ${{ steps.action.outputs.hour }}
        run: |
          echo "actual hour: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "WARN: hour output is empty (may not be exposed by act)"
          elif ! echo "$ACTUAL" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: expected hour to be a number, got: $ACTUAL"
            exit 1
          else
            echo "PASS"
          fi

      - name: Assert minute output is a valid number (0-59)
        env:
          ACTUAL: ${{ steps.action.outputs.minute }}
        run: |
          echo "actual minute: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "WARN: minute output is empty (may not be exposed by act)"
          elif ! echo "$ACTUAL" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: expected minute to be a number, got: $ACTUAL"
            exit 1
          else
            echo "PASS"
          fi

      - name: Assert second output is a valid number (0-59)
        env:
          ACTUAL: ${{ steps.action.outputs.second }}
        run: |
          echo "actual second: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "WARN: second output is empty (may not be exposed by act)"
          elif ! echo "$ACTUAL" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: expected second to be a number, got: $ACTUAL"
            exit 1
          else
            echo "PASS"
          fi

      - name: Assert millisecond output is a valid number (0-999)
        env:
          ACTUAL: ${{ steps.action.outputs.millisecond }}
        run: |
          echo "actual millisecond: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "WARN: millisecond output is empty (may not be exposed by act)"
          elif ! echo "$ACTUAL" | grep -qE '^[0-9]{1,3}$'; then
            echo "FAIL: expected millisecond to be a number, got: $ACTUAL"
            exit 1
          else
            echo "PASS"
          fi
