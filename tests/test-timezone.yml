name: Test timezone input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action_utc
        uses: .
        with:
          timezone: "UTC"
          format: Z

      - name: Assert formattedTime reflects UTC timezone offset
        env:
          FORMATTED: ${{ steps.action_utc.outputs.formattedTime }}
        run: |
          echo "formattedTime (UTC): $FORMATTED"
          # UTC timezone should produce +00:00 offset
          if [ "$FORMATTED" != "+00:00" ]; then
            echo "FAIL: expected '+00:00' for UTC timezone but got '$FORMATTED'"
            exit 1
          fi
          echo "PASS: formattedTime correctly shows +00:00 for UTC timezone"

      - id: action_tz
        uses: .
        with:
          timezone: "Asia/Tokyo"
          format: "YYYY-MM-DD HH:mm:ss Z"

      - name: Assert formattedTime for Asia/Tokyo contains +09:00 offset
        env:
          FORMATTED: ${{ steps.action_tz.outputs.formattedTime }}
        run: |
          echo "formattedTime (Asia/Tokyo): $FORMATTED"
          # Asia/Tokyo is UTC+9, so the offset should be +09:00
          if ! echo "$FORMATTED" | grep -q "+09:00"; then
            echo "FAIL: expected '+09:00' in formattedTime for Asia/Tokyo but got '$FORMATTED'"
            exit 1
          fi
          echo "PASS: formattedTime contains +09:00 for Asia/Tokyo"

      - name: Assert timezone overrides utcOffset (timezone wins)
        id: action_override
        uses: .
        with:
          timezone: "UTC"
          utcOffset: "+08:00"
          format: Z

      - name: Assert timezone takes precedence over utcOffset
        env:
          FORMATTED: ${{ steps.action_override.outputs.formattedTime }}
        run: |
          echo "formattedTime (timezone=UTC, utcOffset=+08:00): $FORMATTED"
          # timezone should override utcOffset, so result should be +00:00
          if [ "$FORMATTED" != "+00:00" ]; then
            echo "FAIL: expected timezone 'UTC' (+00:00) to override utcOffset '+08:00', but got '$FORMATTED'"
            exit 1
          fi
          echo "PASS: timezone correctly overrides utcOffset"
