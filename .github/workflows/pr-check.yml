name: PR check
on:
  pull_request:
    branches:
      - master
permissions: {}
jobs:
  run_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm install
      - run: npm test

  get_output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm install
      - run: npm run build
      - run: node ./dist/index.js
