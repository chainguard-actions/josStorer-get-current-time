name: Test basic usage (no inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get_time
        uses: .
      - name: Assert time output is non-empty
        env:
          TIME_OUT: ${{ steps.get_time.outputs.time }}
        run: |
          echo "time: $TIME_OUT"
          if [ -z "$TIME_OUT" ]; then
            echo "FAIL: time output is empty"
            exit 1
          fi
          echo "PASS: time output is non-empty"
      - name: Assert ISOTime output is non-empty
        env:
          ISO_TIME: ${{ steps.get_time.outputs.ISOTime }}
        run: |
          echo "ISOTime: $ISO_TIME"
          if [ -z "$ISO_TIME" ]; then
            echo "FAIL: ISOTime output is empty"
            exit 1
          fi
          echo "PASS: ISOTime output is non-empty"
      - name: Assert readableTime output is non-empty
        env:
          READABLE: ${{ steps.get_time.outputs.readableTime }}
        run: |
          echo "readableTime: $READABLE"
          if [ -z "$READABLE" ]; then
            echo "FAIL: readableTime output is empty"
            exit 1
          fi
          echo "PASS: readableTime output is non-empty"
      - name: Assert year output is a 4-digit number
        env:
          YEAR: ${{ steps.get_time.outputs.year }}
        run: |
          echo "year: $YEAR"
          if ! echo "$YEAR" | grep -qE '^[0-9]{4}$'; then
            echo "FAIL: year is not a 4-digit number"
            exit 1
          fi
          echo "PASS: year is a 4-digit number"
      - name: Assert month output is a valid number (1-12)
        env:
          MONTH: ${{ steps.get_time.outputs.month }}
        run: |
          echo "month: $MONTH"
          if ! echo "$MONTH" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: month is not a valid number"
            exit 1
          fi
          if [ "$MONTH" -lt 1 ] || [ "$MONTH" -gt 12 ]; then
            echo "FAIL: month $MONTH is out of range 1-12"
            exit 1
          fi
          echo "PASS: month is valid"
      - name: Assert day output is a valid number (1-31)
        env:
          DAY: ${{ steps.get_time.outputs.day }}
        run: |
          echo "day: $DAY"
          if ! echo "$DAY" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: day is not a valid number"
            exit 1
          fi
          if [ "$DAY" -lt 1 ] || [ "$DAY" -gt 31 ]; then
            echo "FAIL: day $DAY is out of range 1-31"
            exit 1
          fi
          echo "PASS: day is valid"
      - name: Assert hour output is a valid number (0-23)
        env:
          HOUR: ${{ steps.get_time.outputs.hour }}
        run: |
          echo "hour: $HOUR"
          if ! echo "$HOUR" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: hour is not a valid number"
            exit 1
          fi
          if [ "$HOUR" -lt 0 ] || [ "$HOUR" -gt 23 ]; then
            echo "FAIL: hour $HOUR is out of range 0-23"
            exit 1
          fi
          echo "PASS: hour is valid"
      - name: Assert minute output is a valid number (0-59)
        env:
          MINUTE: ${{ steps.get_time.outputs.minute }}
        run: |
          echo "minute: $MINUTE"
          if ! echo "$MINUTE" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: minute is not a valid number"
            exit 1
          fi
          if [ "$MINUTE" -lt 0 ] || [ "$MINUTE" -gt 59 ]; then
            echo "FAIL: minute $MINUTE is out of range 0-59"
            exit 1
          fi
          echo "PASS: minute is valid"
      - name: Assert second output is a valid number (0-59)
        env:
          SECOND: ${{ steps.get_time.outputs.second }}
        run: |
          echo "second: $SECOND"
          if ! echo "$SECOND" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: second is not a valid number"
            exit 1
          fi
          if [ "$SECOND" -lt 0 ] || [ "$SECOND" -gt 59 ]; then
            echo "FAIL: second $SECOND is out of range 0-59"
            exit 1
          fi
          echo "PASS: second is valid"
      - name: Assert millisecond output is a valid number (0-999)
        env:
          MS: ${{ steps.get_time.outputs.millisecond }}
        run: |
          echo "millisecond: $MS"
          if ! echo "$MS" | grep -qE '^[0-9]{1,3}$'; then
            echo "FAIL: millisecond is not a valid number"
            exit 1
          fi
          if [ "$MS" -lt 0 ] || [ "$MS" -gt 999 ]; then
            echo "FAIL: millisecond $MS is out of range 0-999"
            exit 1
          fi
          echo "PASS: millisecond is valid"
      - name: Assert time matches ISO 8601 format
        env:
          TIME_OUT: ${{ steps.get_time.outputs.time }}
        run: |
          echo "time: $TIME_OUT"
          if ! echo "$TIME_OUT" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]+Z$'; then
            echo "FAIL: time does not match ISO 8601 format"
            exit 1
          fi
          echo "PASS: time matches ISO 8601 format"
