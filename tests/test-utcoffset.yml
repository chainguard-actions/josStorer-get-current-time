name: Test utcOffset input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          format: "Z"
          utcOffset: "+05:30"
      - name: Assert outputs with utcOffset
        env:
          FORMATTED: ${{ steps.action.outputs.formattedTime }}
          ISO_TIME: ${{ steps.action.outputs.time }}
          READABLE: ${{ steps.action.outputs.readableTime }}
        run: |
          echo "formattedTime: $FORMATTED"
          echo "time: $ISO_TIME"
          echo "readableTime: $READABLE"
          if [ -z "$FORMATTED" ]; then
            echo "FAIL: formattedTime output is empty"
            exit 1
          fi
          # With format "Z" and utcOffset "+05:30", formattedTime should reflect the offset
          if ! echo "$FORMATTED" | grep -qE '^\+05:30$'; then
            echo "FAIL: formattedTime '$FORMATTED' does not match expected offset +05:30"
            exit 1
          fi
          if [ -z "$ISO_TIME" ]; then
            echo "FAIL: time output is empty"
            exit 1
          fi
          if [ -z "$READABLE" ]; then
            echo "FAIL: readableTime output is empty"
            exit 1
          fi
          echo "PASS"
