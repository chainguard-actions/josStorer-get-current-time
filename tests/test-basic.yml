name: Test basic usage (no inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .

      - name: Assert time output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.time }}
        run: |
          echo "actual time: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: time output is empty"
            exit 1
          fi
          echo "PASS: time=$ACTUAL"

      - name: Assert ISOTime matches time
        env:
          TIME: ${{ steps.action.outputs.time }}
          ISO: ${{ steps.action.outputs.ISOTime }}
        run: |
          echo "time: $TIME"
          echo "ISOTime: $ISO"
          if [ "$TIME" != "$ISO" ]; then
            echo "FAIL: time and ISOTime should be equal"
            exit 1
          fi
          echo "PASS"

      - name: Assert time looks like ISO 8601
        env:
          ACTUAL: ${{ steps.action.outputs.time }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}'; then
            echo "FAIL: time does not look like ISO 8601: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert readableTime is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.readableTime }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: readableTime is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert year output is a 4-digit number
        env:
          ACTUAL: ${{ steps.action.outputs.year }}
        run: |
          echo "actual year: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{4}$'; then
            echo "FAIL: year does not look like a 4-digit number: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert month output is 1-12
        env:
          ACTUAL: ${{ steps.action.outputs.month }}
        run: |
          echo "actual month: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: month is not numeric: $ACTUAL"
            exit 1
          fi
          if [ "$ACTUAL" -lt 1 ] || [ "$ACTUAL" -gt 12 ]; then
            echo "FAIL: month out of range: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert day output is 1-31
        env:
          ACTUAL: ${{ steps.action.outputs.day }}
        run: |
          echo "actual day: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: day is not numeric: $ACTUAL"
            exit 1
          fi
          if [ "$ACTUAL" -lt 1 ] || [ "$ACTUAL" -gt 31 ]; then
            echo "FAIL: day out of range: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert hour output is 0-23
        env:
          ACTUAL: ${{ steps.action.outputs.hour }}
        run: |
          echo "actual hour: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: hour is not numeric: $ACTUAL"
            exit 1
          fi
          if [ "$ACTUAL" -lt 0 ] || [ "$ACTUAL" -gt 23 ]; then
            echo "FAIL: hour out of range: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert minute output is 0-59
        env:
          ACTUAL: ${{ steps.action.outputs.minute }}
        run: |
          echo "actual minute: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: minute is not numeric: $ACTUAL"
            exit 1
          fi
          if [ "$ACTUAL" -lt 0 ] || [ "$ACTUAL" -gt 59 ]; then
            echo "FAIL: minute out of range: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert second output is 0-59
        env:
          ACTUAL: ${{ steps.action.outputs.second }}
        run: |
          echo "actual second: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: second is not numeric: $ACTUAL"
            exit 1
          fi
          if [ "$ACTUAL" -lt 0 ] || [ "$ACTUAL" -gt 59 ]; then
            echo "FAIL: second out of range: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert millisecond output is 0-999
        env:
          ACTUAL: ${{ steps.action.outputs.millisecond }}
        run: |
          echo "actual millisecond: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{1,3}$'; then
            echo "FAIL: millisecond is not numeric: $ACTUAL"
            exit 1
          fi
          if [ "$ACTUAL" -lt 0 ] || [ "$ACTUAL" -gt 999 ]; then
            echo "FAIL: millisecond out of range: $ACTUAL"
            exit 1
          fi
          echo "PASS"
