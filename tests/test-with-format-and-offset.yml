name: Test with format and utcOffset inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get-time
        uses: .
        with:
          format: "YYYY-MM-DD HH:mm"
          utcOffset: "+00:00"
      - name: Assert formattedTime output matches expected pattern
        env:
          ACTUAL: ${{ steps.get-time.outputs.formattedTime }}
        run: |
          echo "formattedTime: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected 'formattedTime' output to be non-empty"
            exit 1
          fi
          # Validate format matches YYYY-MM-DD HH:mm pattern
          if ! echo "$ACTUAL" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$'; then
            echo "FAIL: formattedTime '$ACTUAL' does not match expected pattern YYYY-MM-DD HH:mm"
            exit 1
          fi
          echo "PASS"
      - name: Assert time (ISO) output is non-empty
        env:
          ACTUAL: ${{ steps.get-time.outputs.time }}
        run: |
          echo "time: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected 'time' output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert readableTime output is non-empty
        env:
          ACTUAL: ${{ steps.get-time.outputs.readableTime }}
        run: |
          echo "readableTime: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected 'readableTime' output to be non-empty"
            exit 1
          fi
          echo "PASS"
