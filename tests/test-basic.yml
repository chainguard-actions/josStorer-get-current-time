name: Test basic usage (no inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get_time
        uses: .
      - name: Assert time output is non-empty
        env:
          TIME_OUT: ${{ steps.get_time.outputs.time }}
        run: |
          echo "time: $TIME_OUT"
          if [ -z "$TIME_OUT" ]; then
            echo "FAIL: 'time' output is empty"
            exit 1
          fi
          echo "PASS: time=$TIME_OUT"
      - name: Assert ISOTime output is non-empty
        env:
          ISO_TIME: ${{ steps.get_time.outputs.ISOTime }}
        run: |
          echo "ISOTime: $ISO_TIME"
          if [ -z "$ISO_TIME" ]; then
            echo "FAIL: 'ISOTime' output is empty"
            exit 1
          fi
          echo "PASS: ISOTime=$ISO_TIME"
      - name: Assert readableTime output is non-empty
        env:
          READABLE: ${{ steps.get_time.outputs.readableTime }}
        run: |
          echo "readableTime: $READABLE"
          if [ -z "$READABLE" ]; then
            echo "FAIL: 'readableTime' output is empty"
            exit 1
          fi
          echo "PASS: readableTime=$READABLE"
      - name: Assert year output is a 4-digit number
        env:
          YEAR: ${{ steps.get_time.outputs.year }}
        run: |
          echo "year: $YEAR"
          if ! echo "$YEAR" | grep -qE '^[0-9]{4}$'; then
            echo "FAIL: 'year' output is not a 4-digit number: $YEAR"
            exit 1
          fi
          echo "PASS: year=$YEAR"
      - name: Assert month output is a valid number (1-12)
        env:
          MONTH: ${{ steps.get_time.outputs.month }}
        run: |
          echo "month: $MONTH"
          if ! echo "$MONTH" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: 'month' output is not a valid number: $MONTH"
            exit 1
          fi
          echo "PASS: month=$MONTH"
      - name: Assert day output is a valid number (1-31)
        env:
          DAY: ${{ steps.get_time.outputs.day }}
        run: |
          echo "day: $DAY"
          if ! echo "$DAY" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: 'day' output is not a valid number: $DAY"
            exit 1
          fi
          echo "PASS: day=$DAY"
      - name: Assert hour output is a valid number (0-23)
        env:
          HOUR: ${{ steps.get_time.outputs.hour }}
        run: |
          echo "hour: $HOUR"
          if ! echo "$HOUR" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: 'hour' output is not a valid number: $HOUR"
            exit 1
          fi
          echo "PASS: hour=$HOUR"
      - name: Assert minute output is a valid number (0-59)
        env:
          MINUTE: ${{ steps.get_time.outputs.minute }}
        run: |
          echo "minute: $MINUTE"
          if ! echo "$MINUTE" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: 'minute' output is not a valid number: $MINUTE"
            exit 1
          fi
          echo "PASS: minute=$MINUTE"
      - name: Assert second output is a valid number (0-59)
        env:
          SECOND: ${{ steps.get_time.outputs.second }}
        run: |
          echo "second: $SECOND"
          if ! echo "$SECOND" | grep -qE '^[0-9]{1,2}$'; then
            echo "FAIL: 'second' output is not a valid number: $SECOND"
            exit 1
          fi
          echo "PASS: second=$SECOND"
      - name: Assert millisecond output is a valid number (0-999)
        env:
          MS: ${{ steps.get_time.outputs.millisecond }}
        run: |
          echo "millisecond: $MS"
          if ! echo "$MS" | grep -qE '^[0-9]{1,3}$'; then
            echo "FAIL: 'millisecond' output is not a valid number: $MS"
            exit 1
          fi
          echo "PASS: millisecond=$MS"
